<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BanglaHateML — Silver Explanation Verifier</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 20px;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        
        .stats-bar {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: #94a3b8;
        }
        
        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stat-value {
            color: #38bdf8;
            font-weight: 600;
        }
        
        .stat-value.approved { color: #4ade80; }
        .stat-value.rejected { color: #f87171; }
        .stat-value.edited { color: #fbbf24; }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #38bdf8);
            transition: width 0.3s ease;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .sample-num {
            font-size: 14px;
            color: #64748b;
        }
        
        .labels {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .label-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .label-badge.type { background: #312e81; color: #a5b4fc; }
        .label-badge.target { background: #064e3b; color: #6ee7b7; }
        .label-badge.severity { background: #78350f; color: #fbbf24; }
        .label-badge.severity-severe { background: #7f1d1d; color: #fca5a5; }
        
        .comment-text {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 16px;
            line-height: 1.7;
            color: #f1f5f9;
        }
        
        .explanation-section {
            margin-bottom: 16px;
        }
        
        .explanation-section label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .explanation-text {
            width: 100%;
            min-height: 80px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.6;
            color: #e2e8f0;
            font-family: 'Noto Sans Bengali', sans-serif;
            resize: vertical;
        }
        
        .explanation-text:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        
        .actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        
        .btn-approve {
            background: #166534;
            color: #4ade80;
        }
        .btn-approve:hover { background: #15803d; }
        
        .btn-edit {
            background: #854d0e;
            color: #fbbf24;
        }
        .btn-edit:hover { background: #a16207; }
        
        .btn-reject {
            background: #7f1d1d;
            color: #f87171;
        }
        .btn-reject:hover { background: #991b1b; }
        
        .btn-save {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 14px 32px;
            font-size: 16px;
        }
        
        .btn-skip {
            background: #334155;
            color: #94a3b8;
        }
        
        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .nav-btn {
            padding: 8px 16px;
            background: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .nav-btn:hover { background: #475569; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 6px 14px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-btn.active {
            background: #312e81;
            color: #a5b4fc;
            border-color: #4f46e5;
        }
        
        .keyboard-hints {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #64748b;
        }
        
        .keyboard-hints kbd {
            background: #334155;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            color: #e2e8f0;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-indicator.pending { background: #64748b; }
        .status-indicator.approved { background: #4ade80; }
        .status-indicator.rejected { background: #f87171; }
        .status-indicator.edited { background: #fbbf24; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 BanglaHateML — Silver Explanation Verifier</h1>
        <div class="stats-bar">
            <div class="stat">Total: <span class="stat-value" id="totalCount">0</span></div>
            <div class="stat">Reviewed: <span class="stat-value" id="reviewedCount">0</span></div>
            <div class="stat">Approved: <span class="stat-value approved" id="approvedCount">0</span></div>
            <div class="stat">Edited: <span class="stat-value edited" id="editedCount">0</span></div>
            <div class="stat">Rejected: <span class="stat-value rejected" id="rejectedCount">0</span></div>
            <div class="stat">Remaining: <span class="stat-value" id="remainingCount">0</span></div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
    </div>
    
    <div class="container">
        <div class="keyboard-hints">
            Keyboard: <kbd>A</kbd> Approve | <kbd>E</kbd> Edit & Save | <kbd>R</kbd> Reject | <kbd>←</kbd> Previous | <kbd>→</kbd> Next | <kbd>S</kbd> Save to File
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('all')">All</button>
            <button class="filter-btn" onclick="setFilter('pending')">⬜ Pending</button>
            <button class="filter-btn" onclick="setFilter('approved')">✅ Approved</button>
            <button class="filter-btn" onclick="setFilter('edited')">✏️ Edited</button>
            <button class="filter-btn" onclick="setFilter('rejected')">❌ Rejected</button>
            <button class="filter-btn" onclick="setFilter('Abusive')">Abusive</button>
            <button class="filter-btn" onclick="setFilter('Political Hate')">Political</button>
            <button class="filter-btn" onclick="setFilter('Religious Hate')">Religious</button>
            <button class="filter-btn" onclick="setFilter('Profane')">Profane</button>
            <button class="filter-btn" onclick="setFilter('Sexism')">Sexism</button>
            <button class="filter-btn" onclick="setFilter('None')">None</button>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← Previous</button>
            <button class="nav-btn" id="nextBtn" onclick="navigate(1)">Next →</button>
            <button class="nav-btn" onclick="jumpToNextPending()">Next Pending →→</button>
            <button class="btn btn-save" onclick="saveToFile()">💾 Save Progress (S)</button>
        </div>
        
        <div class="card" id="currentCard">
            <div class="card-header">
                <span class="sample-num" id="sampleNum">#1 / 2000</span>
                <div class="labels" id="labelBadges"></div>
            </div>
            
            <div class="comment-text" id="commentText"></div>
            
            <div class="explanation-section">
                <label>Bengali Explanation (edit if needed):</label>
                <textarea class="explanation-text" id="explanationText"></textarea>
            </div>
            
            <div class="actions">
                <button class="btn btn-approve" onclick="markAs('approved')">✅ Approve (A)</button>
                <button class="btn btn-edit" onclick="markAs('edited')">✏️ Save Edit (E)</button>
                <button class="btn btn-reject" onclick="markAs('rejected')">❌ Reject (R)</button>
            </div>
        </div>
    </div>

    <script>
    let data = [];
    let currentIdx = 0;
    let currentFilter = 'all';
    let filteredIndices = [];
    let filterPos = 0;
    
    // Load data
    async function loadData() {
        try {
            const resp = await fetch('silver_explanations.json');
            data = await resp.json();
            
            // Initialize verification status
            data.forEach(d => {
                if (!d.verification_status) d.verification_status = 'pending';
                if (!d.original_explanation) d.original_explanation = d.silver_explanation;
            });
            
            updateFiltered();
            showCurrent();
            updateStats();
        } catch (e) {
            document.getElementById('commentText').textContent = 
                'Error: Could not load silver_explanations.json. Make sure this HTML file is in the same folder as silver_explanations.json and serve it via a local server (python -m http.server 8080).';
        }
    }
    
    function updateFiltered() {
        filteredIndices = [];
        for (let i = 0; i < data.length; i++) {
            const d = data[i];
            if (currentFilter === 'all') {
                filteredIndices.push(i);
            } else if (currentFilter === 'pending' || currentFilter === 'approved' || 
                       currentFilter === 'edited' || currentFilter === 'rejected') {
                if (d.verification_status === currentFilter) filteredIndices.push(i);
            } else {
                if (d.type_of_hate === currentFilter) filteredIndices.push(i);
            }
        }
        filterPos = 0;
    }
    
    function setFilter(f) {
        currentFilter = f;
        updateFiltered();
        
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        if (filteredIndices.length > 0) {
            currentIdx = filteredIndices[0];
            showCurrent();
        }
    }
    
    function showCurrent() {
        if (data.length === 0) return;
        const d = data[currentIdx];
        
        // Find position in filtered view
        filterPos = filteredIndices.indexOf(currentIdx);
        
        document.getElementById('sampleNum').textContent = 
            `#${currentIdx + 1} / ${data.length} (filtered: ${filterPos + 1}/${filteredIndices.length})`;
        
        // Labels
        const badgesHtml = `
            <span class="label-badge type">${d.type_of_hate}</span>
            <span class="label-badge target">${d.target_of_hate}</span>
            <span class="label-badge ${d.severity_of_hate === 'Severe' ? 'severity-severe' : 'severity'}">${d.severity_of_hate}</span>
            <span class="status-indicator ${d.verification_status}"></span>${d.verification_status}
        `;
        document.getElementById('labelBadges').innerHTML = badgesHtml;
        
        document.getElementById('commentText').textContent = d.comment;
        document.getElementById('explanationText').value = d.silver_explanation;
        
        // Highlight card based on status
        const card = document.getElementById('currentCard');
        card.style.borderColor = {
            'pending': '#334155',
            'approved': '#166534',
            'edited': '#854d0e',
            'rejected': '#7f1d1d'
        }[d.verification_status] || '#334155';
        
        document.getElementById('prevBtn').disabled = filterPos <= 0;
        document.getElementById('nextBtn').disabled = filterPos >= filteredIndices.length - 1;
    }
    
    function markAs(status) {
        const d = data[currentIdx];
        d.verification_status = status;
        d.verified = status !== 'rejected';
        
        if (status === 'edited') {
            d.silver_explanation = document.getElementById('explanationText').value;
        }
        
        updateStats();
        navigate(1); // Auto-advance
    }
    
    function navigate(dir) {
        filterPos += dir;
        if (filterPos < 0) filterPos = 0;
        if (filterPos >= filteredIndices.length) filterPos = filteredIndices.length - 1;
        currentIdx = filteredIndices[filterPos];
        showCurrent();
    }
    
    function jumpToNextPending() {
        for (let i = 0; i < data.length; i++) {
            if (data[i].verification_status === 'pending') {
                currentIdx = i;
                showCurrent();
                return;
            }
        }
        alert('All samples have been reviewed!');
    }
    
    function updateStats() {
        const total = data.length;
        const approved = data.filter(d => d.verification_status === 'approved').length;
        const edited = data.filter(d => d.verification_status === 'edited').length;
        const rejected = data.filter(d => d.verification_status === 'rejected').length;
        const reviewed = approved + edited + rejected;
        
        document.getElementById('totalCount').textContent = total;
        document.getElementById('reviewedCount').textContent = reviewed;
        document.getElementById('approvedCount').textContent = approved;
        document.getElementById('editedCount').textContent = edited;
        document.getElementById('rejectedCount').textContent = rejected;
        document.getElementById('remainingCount').textContent = total - reviewed;
        document.getElementById('progressFill').style.width = `${(reviewed / total * 100)}%`;
    }
    
    function saveToFile() {
        // Create verified dataset (approved + edited only)
        const verified = data.filter(d => d.verification_status !== 'rejected');
        
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'silver_explanations_verified.json';
        a.click();
        URL.revokeObjectURL(url);
        
        alert(`Saved! ${verified.length} approved/edited + ${data.length - verified.length} rejected.`);
    }
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'TEXTAREA') {
            if (e.key === 'Escape') e.target.blur();
            return;
        }
        
        switch(e.key) {
            case 'a': case 'A': markAs('approved'); break;
            case 'e': case 'E': markAs('edited'); break;
            case 'r': case 'R': markAs('rejected'); break;
            case 'ArrowLeft': navigate(-1); break;
            case 'ArrowRight': navigate(1); break;
            case 's': case 'S': saveToFile(); break;
        }
    });
    
    loadData();
    </script>
</body>
</html>
